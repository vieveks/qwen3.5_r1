[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iso-rlvr-qwen25"
version = "0.1.0"
description = "Isomorphic RLVR experiments for small math reasoning models."
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.33.0",
  "datasets>=2.20.0",
  "numpy>=1.26.0",
  "peft>=0.12.0",
  "pyyaml>=6.0.1",
  "safetensors>=0.4.3",
  "torch>=2.3.0",
  "tqdm>=4.66.0",
  "transformers>=4.44.0",
  "trl==0.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
