# overlap-filtered heldout. Greedy. Paired with the base eval by family_id.
model_name: Qwen/Qwen3-1.7B
adapter_path: outputs/phase9/stage2/independent_seed23/adapter_or_model
dataset_path: data/stage2_packed_heldout1024.jsonl
output_path: outputs/phase9/stage2/eval_independent_seed23_heldout.jsonl
