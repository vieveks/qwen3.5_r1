model_name: Qwen/Qwen3-1.7B
train_dataset: data/stage2_full_filtered_train.jsonl
eval_dataset: data/stage2_full_packed_heldout.jsonl
output_dir: outputs/phase9/stage3/iso050_seed23
device: auto
seed: 23
max_steps: 300
per_device_train_batch_size: 16
gradient_accumulation_steps: 1
num_generations: 8
max_completion_length: 256
max_new_tokens: 256
temperature: 0.7
top_p: 1.0
learning_rate: 0.000005
beta: 0.0
loss_type: dr_grpo
scale_rewards: group
mask_truncated_completions: true
bf16: true
use_vllm: false
apply_chat_template: true
enable_thinking: false
system_prompt: "Solve each math problem. Return only the requested XML answer block, with no reasoning or extra text."
lora_r: 16
lora_alpha: 32
lora_target_modules: q_proj,k_proj,v_proj,o_proj
logging_steps: 30
save_strategy: "no"
reward_mode: verifier
family_bonus_enabled: true
family_mean_weight: 0.25
all_family_correct_weight: 0.25
parse_complete_threshold: 0.95
reward_std_threshold: 0.05
format_reward: 0.05
missing_format_penalty: -0.10
extra_answer_penalty: 0.10
length_penalty_weight: 0.05
run_final_eval: false
